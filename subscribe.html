<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rock-It Subscription</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; background: #1e1e1e; color: #eee; margin: 0; display: flex; min-height: 100vh; align-items: center; justify-content: center; }
    .card { background: #2a2a2a; border-radius: 12px; padding: 32px 40px; max-width: 420px; width: 100%; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { color: #bbb; margin: 0 0 24px; line-height: 1.5; }
    .price { font-size: 32px; font-weight: 700; margin-bottom: 24px; }
    .price span { font-size: 14px; color: #bbb; font-weight: 400; }
    button { width: 100%; padding: 14px; font-size: 16px; font-weight: 600; border: 0; border-radius: 8px; background: #4078C5; color: #fff; cursor: pointer; }
    button:disabled { background: #555; cursor: not-allowed; }
    .note { font-size: 13px; color: #888; margin-top: 16px; }
    .error { color: #ff6b6b; margin-top: 16px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Rock-It</h1>
    <p>Professional lighting management for touring productions.</p>
    <div class="price">$29 <span>/ month</span></div>
    <button id="subscribe-btn" disabled>Subscribe</button>
    <div class="note" id="note">Loading...</div>
    <div class="error" id="error"></div>
  </div>

  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  <script>
    // Config: replace these three values per environment (sandbox / live)
    const PADDLE_ENV = 'sandbox';
    const PADDLE_CLIENT_TOKEN = 'test_9c8e8126eaacb69f5ae3d2e0707';
    const PRICE_ID = 'pri_01m53c1jt45fyp4yd4z5zynq6c';

    const params = new URLSearchParams(window.location.search);
    const email = params.get('email') || '';
    const userId = params.get('uid') || '';

    const btn = document.getElementById('subscribe-btn');
    const note = document.getElementById('note');
    const errorBox = document.getElementById('error');

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
    }

    if (!userId) {
      note.textContent = '';
      showError('Please open this page from the Subscribe button inside Rock-It.');
    } else {
      Paddle.Environment.set(PADDLE_ENV);
      Paddle.Initialize({
        token: PADDLE_CLIENT_TOKEN,
        eventCallback: function (event) {
          if (event.name === 'checkout.completed') {
            note.textContent = 'Payment received. You can close this page and return to Rock-It.';
            btn.disabled = true;
          }
        }
      });
      note.textContent = email ? 'Subscribing as ' + email : '';
      btn.disabled = false;
    }

    btn.addEventListener('click', function () {
      Paddle.Checkout.open({
        items: [{ priceId: PRICE_ID, quantity: 1 }],
        customer: email ? { email: email } : undefined,
        customData: { supabase_user_id: userId },
        settings: { displayMode: 'overlay', theme: 'dark', locale: 'en' }
      });
    });
  </script>
</body>
</html>
